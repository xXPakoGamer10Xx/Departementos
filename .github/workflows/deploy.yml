name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Despliegue en Servidor de Producción
    runs-on: ubuntu-latest
    steps:
      - name: Verificar configuración de secretos
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ] || [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then
            echo "::error::Faltan los secretos SERVER_HOST o SERVER_SSH_KEY en GitHub Secrets."
            echo "Para configurar el despliegue automático, agrega estos secretos en Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Desplegar mediante SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            echo "Accediendo al directorio del proyecto..."
            cd ${{ secrets.SERVER_PROJECT_PATH || '/opt/habita' }}
            
            echo "Obteniendo los últimos cambios de main..."
            git pull origin main
            
            echo "Reconstruyendo y levantando contenedores con docker-compose.prod.yml..."
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
            
            echo "Limpiando imágenes antiguas en desuso..."
            docker image prune -f
            
            echo "¡Despliegue completado con éxito!"
