<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sin conexión · Habita</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f2f4f3; color: #13202b; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 22rem; margin: 1.5rem; padding: 2rem 1.5rem; background: #fff; border: 1px solid #d9dfdc; border-radius: 12px; text-align: center; }
    h1 { margin: 0 0 .5rem; font-size: 1.25rem; }
    p { margin: 0 0 1.25rem; color: #4d5b66; }
    button { height: 40px; padding: 0 1.25rem; border: 0; border-radius: 6px; background: #1d3fb8; color: #fff; font: inherit; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Sin conexión</h1>
    <p>No pudimos conectarnos. Por seguridad, tu información no se guarda en el teléfono: reconéctate para ver tu cuenta.</p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
